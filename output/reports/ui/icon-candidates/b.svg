<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Tadcap icon candidate B: dashed selection marquee on a screen card, a small annotation box inside, crosshair cursor at the drag corner. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF93B4"/>
      <stop offset="1" stop-color="#E5336A"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FAEEF2"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#6E0A2E" flood-opacity="0.38"/>
    </filter>
    <filter id="backShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#6E0A2E" flood-opacity="0.22"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#6E0A2E" flood-opacity="0.30"/>
    </filter>
  </defs>
  <!-- rounded square (macOS grid: 824 tile on a 1024 canvas) -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#gloss)"/>
  <!-- screen -->
  <rect x="210" y="250" width="604" height="524" rx="44" fill="url(#card)" filter="url(#cardShadow)"/>
  <!-- selection marquee: tinted area + dashed outline -->
  <rect x="290" y="330" width="360" height="290" rx="10" fill="#FF5C8A" fill-opacity="0.14"/>
  <rect x="290" y="330" width="360" height="290" rx="10" fill="none" stroke="#F2437A" stroke-width="30" stroke-dasharray="58 38" stroke-linecap="round"/>
  <!-- annotation box inside the selection -->
  <rect x="352" y="394" width="150" height="104" rx="18" fill="none" stroke="#F2437A" stroke-width="30"/>
  <!-- crosshair at the drag corner (white halo keeps it readable on the card and the tile) -->
  <g stroke-linecap="round" fill="none" transform="translate(650 620)">
    <g stroke="#FFFFFF" stroke-width="62">
      <line x1="0" y1="-128" x2="0" y2="-44"/><line x1="0" y1="44" x2="0" y2="128"/>
      <line x1="-128" y1="0" x2="-44" y2="0"/><line x1="44" y1="0" x2="128" y2="0"/>
    </g>
    <g stroke="#5A0A28" stroke-width="30">
      <line x1="0" y1="-128" x2="0" y2="-44"/><line x1="0" y1="44" x2="0" y2="128"/>
      <line x1="-128" y1="0" x2="-44" y2="0"/><line x1="44" y1="0" x2="128" y2="0"/>
    </g>
  </g>
</svg>
