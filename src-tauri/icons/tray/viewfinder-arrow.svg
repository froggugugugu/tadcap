<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    Tadcap メニューバー(トレイ)アイコン: アプリアイコン案A(`src-tauri/icons/app-icon.svg`)と
    同じモチーフ(四隅のファインダー記号+テーパー矢印)をモノクロ化したもの。
    macOS のテンプレート画像として読み込む前提(黒 + 透明のみ、背景タイル・カード・
    グラデーションなし)。
  -->
  <!-- 四隅のファインダー記号(選択範囲の角、L字)。塗りではなく丸キャップ・丸ジョイントの
       太い線で表現し、18pt相当でも潰れない太さにする(app-icon.svgの角マークと同じ
       構造・sweepフラグ、寸法比だけ縮小)。 -->
  <g stroke="#000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 18,34 V 22 A 4,4 0 0 1 22,18 H 34" />
    <path d="M 66,18 H 78 A 4,4 0 0 1 82,22 V 34" />
    <path d="M 82,66 V 78 A 4,4 0 0 1 78,82 H 66" />
    <path d="M 34,82 H 22 A 4,4 0 0 1 18,78 V 66" />
  </g>
  <!-- 中央のテーパー矢印(右上向き、矢じり付き)。app-icon.svgの矢印と同じ「軸→肩→矢じり→先端」の
       構成を単純化した塗りのみのポリゴン + 起点の丸(アンカー点)。 -->
  <path
    d="M 32.12,72.12 L 56.48,47.76 L 60.37,51.65 L 72,28 L 48.35,39.63 L 52.24,43.52 L 27.88,67.88 Z"
    fill="#000"
  />
  <circle cx="30" cy="70" r="4.5" fill="#000" />
</svg>
