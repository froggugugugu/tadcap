<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80">
  <!--
    Tadcap メニューバー(トレイ)アイコン: モノクロのオタマジャクシ(足が生え始めた姿)。
    macOS のテンプレート画像として読み込む前提(黒 + 透明のみ、線なし・塗りのみ)。
    目は透明の穴として mask で抜く(evenodd 相当)。
    後ろ足2本は丸キャップの太い線(=塗りの塊として見える小さな突起)で表現し、
    先端に小さな丸(足先)を足して18pt高でも潰れず「足」と分かるようにする。
  -->
  <mask id="eye-hole">
    <rect x="0" y="0" width="100" height="80" fill="#fff" />
    <circle cx="22" cy="38" r="4" fill="#000" />
  </mask>
  <g mask="url(#eye-hole)">
    <!-- 尾: 頭の付け根(幅14)→中間(幅7)→先端(幅0)へ滑らかに細くなる、上向きに弧を描く尾 -->
    <path
      d="M 46,38
         Q 55,28 68,36.5
         Q 84,44 92,47
         Q 84,50 68,43.5
         Q 58,48 46,52
         Z"
      fill="#000"
    />
    <!-- 頭: 丸いシルエット -->
    <circle cx="28" cy="45" r="20" fill="#000" />
    <!-- 後ろ足(頭寄り): 起点は頭の下側の輪郭上に乗せ、体とひと続きに見えるようにする -->
    <line x1="40" y1="53" x2="32" y2="66" stroke="#000" stroke-width="7" stroke-linecap="round" />
    <circle cx="32" cy="66" r="4" fill="#000" />
    <!-- 後ろ足(尾の付け根寄り): 起点は頭と尾がつながる下側の輪郭上に乗せる -->
    <line x1="48" y1="53" x2="58" y2="66" stroke="#000" stroke-width="7" stroke-linecap="round" />
    <circle cx="58" cy="66" r="4" fill="#000" />
  </g>
</svg>
