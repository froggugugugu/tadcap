<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Tadcap のアプリアイコン(Dock / Finder / DMG)と紹介ページのロゴの元画像(2026-09-24 人間が案 A を選択)。
    macOS のアイコン格子(1024 のキャンバスに 824 の角丸タイル)。四隅のファインダー記号で「範囲を撮る」、
    白いカード(撮った画面)の上のテーパー矢印で「描き込む」を表す。
    ここから 1024px の PNG を書き出し、`npm run tauri icon <png>` で src-tauri/icons/ の一式を作る。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF93B4"/>
      <stop offset="1" stop-color="#E5336A"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FAEEF2"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#6E0A2E" flood-opacity="0.38"/>
    </filter>
    <filter id="backShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#6E0A2E" flood-opacity="0.22"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#6E0A2E" flood-opacity="0.30"/>
    </filter>
  </defs>
  <!-- rounded square (macOS grid: 824 tile on a 1024 canvas) -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#gloss)"/>
  <!-- viewfinder / selection corner brackets -->
  <g stroke="#FFFFFF" stroke-width="50" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#softShadow)">
    <path d="M206,346 V244 A38,38 0 0 1 244,206 H346"/>
    <path d="M678,206 H780 A38,38 0 0 1 818,244 V346"/>
    <path d="M818,678 V780 A38,38 0 0 1 780,818 H678"/>
    <path d="M346,818 H244 A38,38 0 0 1 206,780 V678"/>
  </g>
  <!-- captured screen -->
  <rect x="300" y="316" width="424" height="392" rx="40" fill="url(#card)" filter="url(#cardShadow)"/>
  <!-- tapered arrow -->
  <g transform="translate(372 640) rotate(-42) scale(1.14)" fill="#F2437A" stroke="#F2437A" stroke-width="14" stroke-linejoin="round">
    <path d="M0,-10 L182,-26 L170,-68 L300,0 L170,68 L182,26 L0,10 Z"/>
    <circle cx="0" cy="0" r="10"/>
  </g>
</svg>
