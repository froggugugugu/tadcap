<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Tadcap のアプリアイコン(Dock / Finder / DMG)の元画像。
    紹介ページのロゴ docs/media/icon.svg(128 の角丸タイル)を、macOS のアプリアイコンの格子
    (1024 のキャンバスに 824 の角丸タイルを余白 100 で置き、下に薄い影)に載せ替えたもの。
    ここから 1024px の PNG を書き出し、`npm run tauri icon <png>` で src-tauri/icons/ の一式を作る。
    メニューバーのアイコン(icons/tray/)は別物で、この画像からは作らない。
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7AA0" />
      <stop offset="1" stop-color="#F5467A" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28" />
    </filter>
    <mask id="tadcap-eye">
      <rect x="0" y="0" width="100" height="80" fill="#fff" />
      <circle cx="22" cy="38" r="4" fill="#000" />
    </mask>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#shadow)" />
  <!-- ロゴの 128 座標系をタイルへ(824 / 128 = 6.4375) -->
  <g transform="translate(100 100) scale(6.4375)">
    <g transform="translate(9 11.5) scale(1.1)" fill="#fff" mask="url(#tadcap-eye)">
      <path d="M 46,38 Q 55,28 68,36.5 Q 84,44 92,47 Q 84,50 68,43.5 Q 58,48 46,52 Z" />
      <circle cx="28" cy="45" r="20" />
      <line x1="40" y1="53" x2="32" y2="66" stroke="#fff" stroke-width="7" stroke-linecap="round" />
      <circle cx="32" cy="66" r="4" />
      <line x1="48" y1="53" x2="58" y2="66" stroke="#fff" stroke-width="7" stroke-linecap="round" />
      <circle cx="58" cy="66" r="4" />
    </g>
  </g>
</svg>
