[package]
name = "tadcap"
version = "1.1.0"
description = "Capture-first screenshot tool for macOS"
authors = ["froggugugugu"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tadcap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
arboard = "3"
regex = "1"   # 自動マスキングの検出規則(既に Cargo.lock にある版。新規クレートなし)

# 編集ウィンドウの前面化(実機不具合①・B2)。いずれも tao が既に依存している版の範囲で
# 直接参照するだけ(新規クレートの追加なし)。`NSApplication::activate`・
# `NSWindow::orderFrontRegardless`/`setLevel` を型付きで呼ぶために使う。
# `NSRunningApplication`・`NSWorkspace` は診断ログ(`[tadcap:front]`)で最前面アプリの
# バンドルIDを出すためだけに有効化する(objc2-foundation 内の機能が増えるのみ)。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["exception"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication", "NSWindow", "NSWorkspace"] }
# 自動マスキング(文字の読み取り)。default-features を切り、使う API だけを有効にする(ARCH_auto-masking §15 の供給経路の条件)
objc2-vision = { version = "0.3", default-features = false, features = ["std", "VNRequest", "VNRecognizeTextRequest", "VNRequestHandler", "VNObservation", "VNTypes", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSArray", "NSString", "NSRange", "NSError", "NSDictionary"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
