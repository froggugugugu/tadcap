<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tadcap</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="app">
      <header class="toolbar" role="toolbar" aria-label="ツールバー">
        <button
          id="capture-button"
          type="button"
          class="icon-button"
          aria-label="キャプチャ(⌘⇧2)"
          title="キャプチャ(⌘⇧2)"
        >
          <svg class="icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
            <path
              d="M6.6 4.6 7.5 3h5l.9 1.6H16A2 2 0 0 1 18 6.6v7.8A2 2 0 0 1 16 16.4H4A2 2 0 0 1 2 14.4V6.6A2 2 0 0 1 4 4.6h2.6Z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linejoin="round"
            />
            <circle cx="10" cy="10.6" r="3.1" fill="none" stroke="currentColor" stroke-width="1.4" />
          </svg>
        </button>

        <div class="toolbar__divider" aria-hidden="true"></div>

        <div id="tool-toolbar" class="tool-toolbar" role="group" aria-label="編集ツール"></div>

        <div class="toolbar__divider" aria-hidden="true"></div>

        <div id="color-picker" class="color-picker" role="group" aria-label="色"></div>

        <div class="toolbar__divider" aria-hidden="true"></div>

        <div id="font-size-picker" class="tool-toolbar" role="group" aria-label="文字サイズ"></div>

        <div class="toolbar__spacer"></div>

        <div class="tool-toolbar" role="group" aria-label="取り消し・やり直し">
          <button
            id="undo-button"
            type="button"
            class="icon-button"
            disabled
            data-preserve-pending-shape
            aria-label="取り消し(⌘Z)"
            title="取り消し(⌘Z)"
          >
            <svg class="icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
              <path
                d="M7.5 5 4 8.5 7.5 12M4.5 8.5h7.25a4 4 0 0 1 0 8H9"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button
            id="redo-button"
            type="button"
            class="icon-button"
            disabled
            data-preserve-pending-shape
            aria-label="やり直し(⌘⇧Z)"
            title="やり直し(⌘⇧Z)"
          >
            <svg class="icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
              <path
                d="M12.5 5 16 8.5 12.5 12M15.5 8.5H8.25a4 4 0 0 0 0 8H11"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>

        <div class="toolbar__divider" aria-hidden="true"></div>

        <button
          id="clipboard-copy-button"
          type="button"
          class="icon-button"
          disabled
          aria-label="クリップボードにコピー(⌘C)"
          title="クリップボードにコピー(⌘C)"
        >
          <svg class="icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
            <rect x="6.5" y="3" width="7" height="3" rx="1" fill="none" stroke="currentColor" stroke-width="1.4" />
            <path
              d="M6.5 4.8H5.4A1.9 1.9 0 0 0 3.5 6.7v8.8a1.9 1.9 0 0 0 1.9 1.9h9.2a1.9 1.9 0 0 0 1.9-1.9V6.7a1.9 1.9 0 0 0-1.9-1.9h-1.1"
              fill="none"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </header>

      <div class="main-area">
        <section class="canvas-area">
          <canvas id="capture-canvas"></canvas>
          <p id="empty-state" class="empty-state">
            <kbd>⌘⇧2</kbd> でキャプチャ
          </p>
        </section>
        <nav id="history-sidebar" class="history-sidebar" aria-label="セッション内履歴"></nav>
      </div>

      <div class="toast-region">
        <p id="capture-status" class="toast" role="status"></p>
        <p id="clipboard-status" class="toast" role="status"></p>
      </div>
    </main>
  </body>
</html>
