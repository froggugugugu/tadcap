name: release
on:
  push:
    tags: ["v*"]

# Builds the macOS package for Apple silicon (Developer ID signed and notarized) and publishes it as a GitHub Release:
# Tadcap-<version>-arm64.dmg and Tadcap-<version>-arm64.zip (the file scripts/install.sh installs).
# build only reads the repository: dependency code never runs next to a token that can write. publish holds
# contents: write, runs no repository code, and attaches the files build verified to a draft before publishing it,
# so the release is complete when it becomes visible.
# The signing and notarization secrets live in the "release" environment (docs/release-notarization.md §7) and are
# handed to the keychain and packaging steps only; that environment is limited to v* tags.
# Actions are pinned to commit SHAs (version in the comment); runner images are pinned too.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    environment: release
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm }
      - name: Tag must match the version in package.json, tauri.conf.json and Cargo.toml
        run: |
          want="${GITHUB_REF_NAME#v}"
          npm_v="$(node -p "require('./package.json').version")"
          conf_v="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo_v="$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)"
          for v in "$npm_v" "$conf_v" "$cargo_v"; do
            [ "$v" = "$want" ] || { echo "tag $GITHUB_REF_NAME does not match: package.json $npm_v, tauri.conf.json $conf_v, Cargo.toml $cargo_v"; exit 1; }
          done
      # The runner image ships rustup; install the toolchain here instead of through another action.
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version
      # Install scripts of dependencies do not run (none of them needs one).
      - run: npm ci --ignore-scripts
      - name: Checks (type check + frontend build, unit tests, Rust tests, clippy)
        run: |
          npm run build
          npm run test:run
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: THIRD_PARTY_LICENSES.md must match the dependencies (npm run licenses)
        run: npm run licenses:check
      # The signing certificate goes into a throwaway keychain on the search list, so both Tauri (app) and
      # package-mac.sh (dmg) find it; Tauri's own APPLE_CERTIFICATE import is not used. The .p12 and its password
      # reach this step only, not the build below.
      - name: Signing keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD; do
            [ -n "${!v}" ] || { echo "secret $v is missing in the release environment"; exit 1; }
          done
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pw="$(openssl rand -hex 24)"
          security create-keychain -p "$kc_pw" "$kc"
          security set-keychain-settings "$kc"   # no auto-lock: the build and two notarizations can take a while
          security unlock-keychain -p "$kc_pw" "$kc"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -f pkcs12 -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without the Developer ID G2 intermediate the certificate is untrusted and codesign finds no identity.
          # A .p12 exported from Keychain Access usually carries it already; importing it twice fails.
          if ! security find-certificate -c "Developer ID Certification Authority" "$kc" > /dev/null 2>&1; then
            g2="$RUNNER_TEMP/DeveloperIDG2CA.cer"
            curl -fsSLo "$g2" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
            echo "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  $g2" | shasum -a 256 -c
            security import "$g2" -k "$kc"
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$kc"
          security find-identity -v -p codesigning "$kc" | grep -qE '[1-9][0-9]* valid identities found' \
            || { echo "no valid signing identity: the .p12 must hold the Developer ID Application certificate with its private key"; exit 1; }
      # scripts/package-mac.sh runs `tauri build` with CI=true (the dmg skips the Finder layout step) and writes release/.
      # With APPLE_SIGNING_IDENTITY it signs and notarizes the app and the dmg. Tauri notarizes during the build, so the
      # API key file and the unlocked keychain are there while dependency code runs (docs/release-notarization.md §7).
      - name: Package, sign and notarize
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          for v in APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8; do
            [ -n "${!v}" ] || { echo "secret $v is missing in the release environment"; exit 1; }
          done
          security find-identity -v -p codesigning | grep -qF "\"$APPLE_SIGNING_IDENTITY\"" \
            || { echo "APPLE_SIGNING_IDENTITY does not match the imported certificate (no quotes or extra spaces around it)"; exit 1; }
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
          trap 'rm -f "$APPLE_API_KEY_PATH"' EXIT
          printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          unset APPLE_API_KEY_P8
          npm run dist:mac
      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
      - name: The dmg and the app in it must be notarized and intact (a broken signature makes macOS call the download damaged)
        run: |
          dmg="$(ls release/Tadcap-*-arm64.dmg)"
          xcrun stapler validate "$dmg"
          out="$(spctl -a -vv -t install "$dmg" 2>&1 || true)"; echo "$out"; grep -q 'source=Notarized Developer ID' <<< "$out"
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          codesign --verify --deep --strict --verbose=2 "$mnt/Tadcap.app"
          out="$(spctl -a -vv "$mnt/Tadcap.app" 2>&1 || true)"; echo "$out"; grep -q 'source=Notarized Developer ID' <<< "$out"
          hdiutil detach "$mnt"
      - name: The installer puts the built app in place with an intact signature
        run: |
          dir="$(mktemp -d)"
          TADCAP_ZIP="$(ls release/Tadcap-*-arm64.zip)" TADCAP_APP_DIR="$dir" TADCAP_NO_OPEN=1 bash scripts/install.sh
          codesign --verify --deep --strict "$dir/Tadcap.app"
          xcrun stapler validate "$dir/Tadcap.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$dir/Tadcap.app/Contents/Info.plist")" = "${GITHUB_REF_NAME#v}"
      - name: The app carries the license notices
        run: |
          res="src-tauri/target/release/bundle/macos/Tadcap.app/Contents/Resources"
          for f in LICENSE.txt THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.md; do test -s "$res/licenses/$f"; done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: mac, path: release }
      - name: Create the release as a draft with dmg / zip attached, then publish it
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.dmg release/*.zip --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$GITHUB_REF_NAME" --generate-notes
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
        env: { GH_TOKEN: "${{ github.token }}" }
